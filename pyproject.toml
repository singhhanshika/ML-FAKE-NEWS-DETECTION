[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-detector"
version = "1.0.0"
description = "Leakage-aware fake news text classification with scikit-learn and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.4.2",
  "matplotlib==3.9.2",
  "numpy==2.1.2",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "streamlit==1.39.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "ruff==0.7.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

